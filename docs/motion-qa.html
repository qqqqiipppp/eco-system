<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모션 그림 확인</title>
<!-- Game modules load pictures from the site root, so this page reads from there too. -->
<base href="../">
<style>
body{font:17px/1.6 "Malgun Gothic",sans-serif;color:#243b2e;background:#eff2e7;margin:20px auto;max-width:1100px;padding:0 12px}
article{background:#fffef5;border:1px solid #b7c5a8;border-radius:12px;padding:16px 20px;margin:16px 0}
h2{margin:0 0 8px;font-size:22px}h3{margin:12px 0 6px;font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
figure{margin:0;text-align:center;font-size:14px;color:#5d6b55}
.stage{position:relative;background:#dfe9c9;border-bottom:4px solid #9b7b52;border-radius:8px 8px 0 0;overflow:hidden}
.stage img{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:contain}
.thumb{position:relative;width:192px;height:144px;background:#fff;border:1px solid #d5ddc8;border-radius:8px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.thumb img.under{opacity:.45;filter:sepia(1) saturate(6) hue-rotate(-40deg)}
.thumb img.over{opacity:.75}
.warn{color:#7a1f15;font-weight:700}.ok{color:#24501a}
.empty{padding:20px;background:#fffef5;border-radius:12px}
</style>
<h1>모션 그림 확인</h1>
<p>게임에 넣은 프레임을 <b>게임 크기·게임 속도</b>로 돌려 봅니다. 겹쳐 보기에서 <span style="color:#b03a20">붉은 그림</span>이 기본 그림이에요. 몸통이 붉은 그림과 같은 자리에 있어야 해요. 다리·날개·머리만 달라야 합니다. ⚠는 넣을 때 자동 검사에서 나온 경고예요.</p>
<p>열기: 저장소 폴더에서 <code>python -m http.server</code>를 실행한 뒤 <code>/docs/motion-qa.html</code></p>
<main id="list"></main>
<script type="module">
import {paintedFrames} from './js/ui/species-frames.js';
import {hopPose,hopTiming,flyTiming,moveStyle} from './js/ui/species-visuals.js';
import {speciesProfiles} from './data/interaction-config.js';
import {organismById} from './data/organisms.js';
const dir='./assets/images/species-raster/',manifest=await (await fetch(dir+'manifest.json')).json();
const stageNames={nymph:'약충',sprout:'새싹',mycelium:'균사체'};
const el=(tag,props={},kids=[])=>{const e=Object.assign(document.createElement(tag),props);e.append(...kids);return e;};
const players=[];
const list=document.querySelector('#list');
const keys=Object.keys(paintedFrames).concat(Object.keys(manifest.stages||{}).filter(k=>!paintedFrames[k]));
if(!keys.length)list.append(el('p',{className:'empty',textContent:'아직 넣은 모션 그림이 없어요.'}));
for(const key of keys){
 const [id,stage]=key.split(':'),entry=stage?manifest.stages[key]:manifest.species[id],frames=entry.frames||{},size=speciesProfiles[id];
 const article=el('article',{},[el('h2',{textContent:`${organismById[id].name}${stage?' '+(stageNames[stage]||stage):''} (${key})`})]);
 if(stage)article.append(el('p',{textContent:'성장 단계 기본 그림'}),el('div',{className:'thumb'},[el('img',{src:dir+entry.file})]));
 for(const [state,count] of Object.entries(paintedFrames[key]||{})){
  const style=state==='move'?moveStyle(id,stage):'loop',srcs=Array.from({length:count},(_,n)=>dir+frames[`${state}-${n}`].file);
  const label={hop:'도약',fly:'날기',loop:'반복'}[style];
  const live=[1,3].map(zoom=>{const img=el('img',{src:srcs[0]}),box=el('div',{className:'stage'},[img]);
   box.style.width=size.width*zoom+'px';box.style.height=size.height*zoom*1.6+'px';img.style.height=size.height*zoom+'px';
   players.push({img,srcs,style,height:size.height*zoom});return el('figure',{},[box,`게임 크기${zoom>1?' ×'+zoom:''}`]);});
  const thumbs=srcs.map((src,n)=>{const f=frames[`${state}-${n}`],checks=f.checks||[];
   return el('figure',{},[el('div',{className:'thumb'},[el('img',{className:'under',src:dir+entry.file}),el('img',{className:'over',src})]),
    el('div',{className:checks.length?'warn':'ok',textContent:`${state}-${n} ${checks.length?'⚠ '+checks.join(' / '):'✓'}`})]);});
  article.append(el('h3',{textContent:`${state} · ${count}장 · ${label}`}),el('div',{className:'row'},[...live,...thumbs]));
 }
 list.append(article);
}
// The game's own timing: hops on hopPose, flight on flyTiming, loops every 0.22 s.
const t0=performance.now();
(function tick(now){const t=(now-t0)/1000;
 for(const p of players){let frame,lift=0;
  if(p.style==='hop'){const h=hopPose(t%hopTiming.cycle);frame=h.frame;lift=h.lift;}
  else if(p.style==='fly'){frame=Math.floor(t/flyTiming.flap)%p.srcs.length;lift=flyTiming.height;}
  else frame=Math.floor(t/.22)%p.srcs.length;
  if(p.img.getAttribute('src')!==p.srcs[frame])p.img.src=p.srcs[frame];
  p.img.style.transform=`translateY(${-lift*p.height}px)`;}
 requestAnimationFrame(tick);})(t0);
</script>
